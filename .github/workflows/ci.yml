name: heat-engine-spec CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for ajv-cli via npx)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for build-fixtures.py determinism check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON Schemas + fixture headers + source_ref linter
        run: ./scripts/validate-fixtures.sh

      - name: Verify build-fixtures.py output matches committed CSV
        run: |
          python3 scripts/build-fixtures.py
          git diff --exit-code spec/tier1-foundation/wet-bulb.fixtures.csv \
            || (echo "build-fixtures.py output diverges from committed CSV" && exit 1)

      - name: Verify generate-types.sh output matches committed types
        run: |
          ./scripts/generate-types.sh
          git diff --exit-code packages/spec-types-ts/src/generated/ \
            || (echo "generate-types.sh output diverges from committed types" && exit 1)

  ts-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/spec-types-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build + test TS
        run: |
          npm ci
          npm run build
          npm test

  dart-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/spec-types-dart
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Sync fixtures + analyze + test Dart
        run: |
          dart run tool/sync_fixtures.dart
          dart pub get
          dart analyze
          dart test

  cross-lang-equiv:
    runs-on: ubuntu-latest
    needs: [ts-conformance, dart-conformance]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: TS build + test
        working-directory: packages/spec-types-ts
        run: |
          npm ci
          npm run build
          npm test

      - name: Dart sync + analyze + test
        working-directory: packages/spec-types-dart
        run: |
          dart run tool/sync_fixtures.dart
          dart pub get
          dart analyze
          dart test

      - name: Document equivalence
        run: |
          echo "Both reference impls passed in the same container at SHA $(git rev-parse HEAD)."
          echo "Cross-language byte-equal canonicalJson(audit) is enforced by cascade-replay/*.json"
          echo "expectedAudit fields, which both ts-conformance and dart-conformance verify against."
